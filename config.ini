# Configuration file for Ghidra Analysis Scripts
# Edit these paths to match your system configuration

[Paths]
# Ghidra installation directory
GHIDRA_PATH = C:\Tools\ghidra_12.0_PUBLIC_20251205\ghidra_12.0_PUBLIC

# Target executable to analyze
TARGET_EXE = C:\Program Files\MetaTrader 5\MetaEditor64.exe

# Project directory (where Ghidra will store analysis)
# Leave empty to use default: ./ghidra_analysis
PROJECT_DIR =

# Output directory for reports and exports
# Leave empty to use default: ./analysis_results
OUTPUT_DIR =

# Project name in Ghidra
PROJECT_NAME = MetaEditor_Analysis

[Analysis]
# Analysis timeout per file in seconds (default: 300 = 5 minutes)
TIMEOUT = 300

# Enable verbose output
VERBOSE = true

# Overwrite existing project
OVERWRITE = true

[Export]
# Enable function export
EXPORT_FUNCTIONS = true

# Enable strings export
EXPORT_STRINGS = true

# Enable imports/exports analysis
EXPORT_IMPORTS = true

# Minimum string length to export
MIN_STRING_LENGTH = 4

[Advanced]
# Additional Ghidra analyzer options (leave empty for defaults)
ANALYZER_OPTIONS =

# Custom script path for additional Ghidra scripts
CUSTOM_SCRIPT_PATH =

# Maximum memory for Ghidra (e.g., 4G, 8G)
MAX_MEMORY = 4G
